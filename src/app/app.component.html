<nav class="simple-light-navbar">
    <div class="navbar-content">
        <div class="brand-logo">
            <a [routerLink]="['/']">Coding Bible Ecommerce</a>
        </div>
        <ul class="nav-links-list">
            <li class="nav-item">
                <a
                    [routerLink]="['/']"
                    routerLinkActive="active-nav-item"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="nav-link"
                >
                    Home
                </a>
            </li>
            <li class="nav-item">
                <a
                    [routerLink]="['','product']"
                    [routerLinkActiveOptions]="{ exact: true }"
                    [queryParams]="{page:1}"
                    [fragment]="'loading'"
                    routerLinkActive="active-nav-item"
                    class="nav-link"
                >
                    Products
                </a>
            </li>
        </ul>
    </div>
</nav>
<main class="main-app-content">
  @if(loading){
    <div style="position:fixed;top:0;left:0;right:0;padding:8px;background:#222;color:#fff">
      Loading...
    </div>
  }
    <router-outlet></router-outlet>


</main>
